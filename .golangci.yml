version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - misspell
    - noctx
    - revive
  exclusions:
    rules:
      # CLAUDE.md: exported identifiers get a doc comment only when the name
      # isn't self-explanatory, so revive's "every export needs one" is off.
      - linters: [revive]
        text: "^exported: .* should have comment"

formatters:
  enable:
    - gofmt
    - goimports
